<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">愿你的生命如花朵般绽放</title>
  <desc id="desc">深色横幅：暖白文字与珊瑚色花朵，花朵循环绽放。</desc>
  <style>
    .bg{fill:#14100d}
    .border{fill:none;stroke:#f0eadf;stroke-opacity:.08;stroke-width:1.5}
    .ink{fill:#f0eadf}
    .accent{fill:#e07a52}
    .rule{stroke:#e07a52;stroke-width:2;stroke-linecap:round;fill:none}
    .phrase{font-family:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;font-weight:600;letter-spacing:6px}
    .txt{opacity:0;animation:rise .9s cubic-bezier(.22,.61,.36,1) forwards}
    .t1{animation-delay:.15s}
    .t2{animation-delay:.45s}
    .rule-in{opacity:0;animation:rise .9s ease-out .7s forwards}
    .ring{fill:none;stroke:#f0eadf;stroke-opacity:.16;stroke-width:1.5}
    .ring-dash{fill:none;stroke:#e07a52;stroke-opacity:.5;stroke-width:1.5;stroke-dasharray:2 10;stroke-linecap:round;animation:dash 24s linear infinite}
    .petal{fill:#e07a52;fill-opacity:.08;stroke:#e07a52;stroke-width:2.5;stroke-linejoin:round;transform-box:fill-box;transform-origin:50% 100%;animation:bloom 14s cubic-bezier(.3,.7,.2,1) infinite}
    .p2{animation-delay:.12s}.p3{animation-delay:.24s}.p4{animation-delay:.36s}.p5{animation-delay:.48s}.p6{animation-delay:.6s}.p7{animation-delay:.72s}.p8{animation-delay:.84s}
    .stamen{animation:pulse 4s ease-in-out infinite}
    .sway{transform-box:fill-box;transform-origin:50% 50%;animation:sway 11s ease-in-out infinite}
    .orbit{transform-box:fill-box;transform-origin:50% 50%;animation:spin 60s linear infinite}
    .mote{animation:mote 9s ease-in-out infinite}
    .m2{animation-duration:12s;animation-delay:-4s}
    .m3{animation-duration:8s;animation-delay:-2s}
    .m4{animation-duration:13s;animation-delay:-6s}
    .m5{animation-duration:10s;animation-delay:-5s}
    @keyframes bloom{0%{transform:scale(.12);opacity:0}12%{transform:scale(1);opacity:1}72%{transform:scale(1);opacity:1}86%{transform:scale(.12);opacity:0}100%{transform:scale(.12);opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
    @keyframes dash{to{stroke-dashoffset:-120}}
    @keyframes mote{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(7px,-13px);opacity:.8}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.txt,.rule-in{opacity:1}.petal{opacity:1;transform:none}.mote{opacity:.5}}
  </style>
  <rect class="bg" width="1200" height="360" rx="24"/>
  <rect class="border" x=".75" y=".75" width="1198.5" height="358.5" rx="23.25"/>
  <g class="txt t1"><text x="88" y="156" font-size="64" class="phrase ink">愿你的生命</text></g>
  <g class="txt t2"><text x="88" y="238" font-size="64" class="phrase accent">如花朵般绽放</text></g>
  <g class="rule-in"><path d="M90 286h96" class="rule"/><circle cx="198" cy="286" r="3" class="accent"/></g>
  <g transform="translate(960 180)">
    <g class="sway">
      <circle class="ring" r="150"/>
      <g class="orbit"><circle r="128" fill="none" stroke="none"/><circle cx="0" cy="-128" r="4" class="accent"/></g>
      <circle class="ring-dash" r="128"/>
      <g>
        <g transform="rotate(0)"><path class="petal p1" d="M0 0C-18-40-18-76 0-104C18-76 18-40 0 0Z"/></g>
        <g transform="rotate(45)"><path class="petal p2" d="M0 0C-18-40-18-76 0-104C18-76 18-40 0 0Z"/></g>
        <g transform="rotate(90)"><path class="petal p3" d="M0 0C-18-40-18-76 0-104C18-76 18-40 0 0Z"/></g>
        <g transform="rotate(135)"><path class="petal p4" d="M0 0C-18-40-18-76 0-104C18-76 18-40 0 0Z"/></g>
        <g transform="rotate(180)"><path class="petal p5" d="M0 0C-18-40-18-76 0-104C18-76 18-40 0 0Z"/></g>
        <g transform="rotate(225)"><path class="petal p6" d="M0 0C-18-40-18-76 0-104C18-76 18-40 0 0Z"/></g>
        <g transform="rotate(270)"><path class="petal p7" d="M0 0C-18-40-18-76 0-104C18-76 18-40 0 0Z"/></g>
        <g transform="rotate(315)"><path class="petal p8" d="M0 0C-18-40-18-76 0-104C18-76 18-40 0 0Z"/></g>
      </g>
      <g class="stamen"><circle r="15" class="accent"/><circle r="6" class="bg"/></g>
    </g>
  </g>
  <g transform="translate(760 86)"><g class="mote"><circle r="2.5" class="accent"/></g></g>
  <g transform="translate(1120 96)"><g class="mote m2"><circle r="2" class="ink"/></g></g>
  <g transform="translate(872 310)"><g class="mote m3"><circle r="2.5" class="ink"/></g></g>
  <g transform="translate(1150 284)"><g class="mote m4"><circle r="3" class="accent"/></g></g>
  <g transform="translate(724 268)"><g class="mote m5"><circle r="2" class="ink"/></g></g>
</svg>
