name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true
          path: profile/stats.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Pad stats card for alignment
        run: |
          python3 - <<'EOF'
          import re
          p = "profile/stats.svg"
          s = open(p).read()
          pad = 30
          m = re.search(r'<svg\b[^>]*>', s, re.S)
          tag = m.group(0)
          h = int(re.search(r'height="(\d+)"', tag).group(1))
          vw, vh = map(int, re.search(r'viewBox="0 0 (\d+) (\d+)"', tag).groups())
          new_tag = tag.replace(f'height="{h}"', f'height="{h + pad}"', 1)
          new_tag = new_tag.replace(f'viewBox="0 0 {vw} {vh}"', f'viewBox="0 -{pad} {vw} {vh + pad}"', 1)
          s = s.replace(tag, new_tag, 1)
          open(p, "w").write(s)
          EOF

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update README stats card"
          git push
